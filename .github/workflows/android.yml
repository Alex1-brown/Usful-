name: Android Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - useful-pro
      - useful-pro-next
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("www/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No JavaScript block found")
          Path("www/app.js").write_text(scripts[-1])
          PY
          node --check www/app.js

      - name: Apply Useful launcher icon
        working-directory: android
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#39E58C"
                  android:pathData="M150,132 L150,271 C150,347 195,383 256,383 C317,383 362,347 362,271 L362,132 L304,132 L304,269 C304,307 288,328 256,328 C224,328 208,307 208,269 L208,132 Z"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Set Android SDK 36
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("variables.gradle")
          s = p.read_text()
          s = s.replace("compileSdkVersion = 35", "compileSdkVersion = 36")
          s = s.replace("targetSdkVersion = 35", "targetSdkVersion = 36")
          s = s.replace("compileSdkVersion = 34", "compileSdkVersion = 36")
          s = s.replace("targetSdkVersion = 34", "targetSdkVersion = 36")
          p.write_text(s)
          PY

      - name: Set Useful Pro version
        working-directory: android
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          s, code_count = re.subn(r"versionCode\s+\d+", "versionCode 3", s, count=1)
          s, name_count = re.subn(r"versionName\s+[\"'][^\"']+[\"']", 'versionName "2.1.0"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: useful-pro-android-2.1.0
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
