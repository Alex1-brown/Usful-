name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android SDK 36
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("variables.gradle")
          s = p.read_text()
          s = s.replace("compileSdkVersion = 35", "compileSdkVersion = 36")
          s = s.replace("targetSdkVersion = 35", "targetSdkVersion = 36")
          s = s.replace("compileSdkVersion = 34", "compileSdkVersion = 36")
          s = s.replace("targetSdkVersion = 34", "targetSdkVersion = 36")
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocket-utility-android-1.0.0
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
